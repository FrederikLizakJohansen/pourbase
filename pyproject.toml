[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pourbase"
dynamic = ["version"]
description = "Source-linked experimental thermochemistry database and Pourbaix diagram calculator"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Frederik Lizak Johansen"}]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8",
  "scipy>=1.10",
]
keywords = ["Pourbaix diagram", "Gibbs energy", "thermochemistry", "electrochemistry", "corrosion", "database", "MCP"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.optional-dependencies]
materials-project = ["mp-api[contribs]>=0.46"]
gui = ["pyside6>=6.5", "pyqtgraph>=0.13", "keyring>=24"]
mcp = ["mcp>=1.10"]

[project.scripts]
pourbase = "pourbase.cli:main"
pourbase-mcp = "pourbase.mcp_server:main"

[project.gui-scripts]
pourbase-gui = "pourbase.gui:main"

[project.urls]
Repository = "https://github.com/FrederikLizakJohansen/pourbase"
Issues = "https://github.com/FrederikLizakJohansen/pourbase/issues"
Changelog = "https://github.com/FrederikLizakJohansen/pourbase/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "pourbase.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pourbase = ["py.typed", "data/pourbase.sqlite", "data/selection-policy.toml", "data/nasa-cea-LICENSE.txt", "data/nasa-cea-NOTICE.txt", "gui/assets/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "W6", "B006", "B008", "UP035"]
