[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pourbase"
version = "1.0.0rc2"
description = "Source-linked experimental thermochemistry database and Pourbaix diagram calculator"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Frederik Lizak Johansen"}]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8",
]
keywords = ["Pourbaix diagram", "Gibbs energy", "thermochemistry", "electrochemistry", "corrosion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
materials-project = ["mp-api[contribs]>=0.46"]
gui = ["pyside6>=6.5", "pyqtgraph>=0.13", "keyring>=24"]

[project.scripts]
pourbase = "pourbase.cli:main"

[project.gui-scripts]
pourbase-gui = "pourbase.gui:main"

[project.urls]
Repository = "https://github.com/FrederikLizakJohansen/pourbase"
Issues = "https://github.com/FrederikLizakJohansen/pourbase/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pourbase = ["py.typed", "data/pourbase.sqlite", "gui/assets/*"]
