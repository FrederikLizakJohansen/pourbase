# This is the default rule for picking one value per species and property from
# reported_thermochemistry. When sources disagree, the rankings below decide
# which value goes into the calculation.
#
# Nothing gets deleted or rewritten in the database. The other reported values
# are still there, along with their sources, so you can compare them later.
#
# Want to use your own ranking? Make a copy of this file, edit it, then load it
# with pourbase.SelectionPolicy.load(path).

name = "pourbase default"
version = "1"

# Flag species for review if their eligible values differ by more than this
# many kJ/mol. This is a warning, not a reason to discard either value.
review_threshold_kJ_mol = 5.0

# Never pick values with these statuses, even if their source ranks highly.
# The records stay in the database; they just cannot be recommended.
ineligible_statuses = ["superseded_source_value", "terminal_evidence_gap"]

# If the source ranking doesn't settle a choice, try these tie-breaks in order:
#
# element_consistency  Prefer the source family covering the most species of
#                      the same element. This helps keep related data together.
# original_publication Prefer the original within a reviewed evaluation and
#                      derivation. Independent revisions reach later tie-breaks.
#                      Unreviewed groups retain the legacy first-author rule.
# stated_uncertainty   Prefer a value with a reported uncertainty over one
#                      without. This does not mean picking the smallest error.
# recency              If there's still a tie, pick the newer publication.
tie_breaks = ["element_consistency", "original_publication", "stated_uncertainty", "recency"]

# Source classes, from highest to lowest priority. Within each class, the
# families are also ranked in the order shown.
#
# This is a practical default, not a guarantee that every value from a critical
# review is better than every individual experiment. If you disagree with the
# rankings, that's exactly what a custom policy is for.
[[classes]]
name = "A"
description = "International critical reviews"
families = ["CODATA", "NEA-TDB"]

[[classes]]
name = "B"
description = "Critical compilations and internally consistent datasets"
families = ["NBS Tables", "NBS Technical Notes", "NIST-JANAF", "Robie & Hemingway", "Miron", "NIST WebBook"]

[[classes]]
name = "C"
description = "Peer-reviewed critical evaluations of one system or element"
families = ["IUPAC standard potentials", "US Bureau of Mines"]

[[classes]]
name = "D"
description = "Single peer-reviewed experimental determinations"
families = ["experimental papers"]

[[classes]]
name = "E"
description = "Estimates: models fitted to measured data first, then predictive correlations"
families = ["estimates", "Shock and Sverjensky correlations"]

[[classes]]
name = "F"
description = "Computed values"
families = ["Materials Project"]

# How pourbase recognizes a source family from its citation. The first family
# with a matching pattern wins, so keep that in mind if you add new patterns.
# If nothing matches, the value is assigned to "estimates" if it's an estimate,
# or "experimental papers" otherwise.
# These patterns classify sources; they don't change any reported numbers.
[families]
"CODATA" = ["CODATA"]
"NEA-TDB" = ["Nuclear Energy Agency"]
"NBS Tables" = ["NBS Tables of Chemical Thermodynamic Properties"]
"NBS Technical Notes" = ["NBS Technical Note", "Selected Values of Chemical Thermodynamic Properties"]
"NIST-JANAF" = ["JANAF"]
"NIST WebBook" = ["WebBook"]
"Robie & Hemingway" = ["Robie, R. A. and Hemingway"]
"Miron" = ["Miron, G. D."]
"IUPAC standard potentials" = ["Standard Potentials in Aqueous Solution"]
"US Bureau of Mines" = ["Bureau of Mines"]
"Shock and Sverjensky correlations" = ["Shock, E. L.", "Sverjensky, D. A.", "Sassani, D. C."]
"Materials Project" = ["Materials Project"]

# Exclusions: values we want to keep as evidence but not use in calculations.
# The evidence status alone doesn't catch every issue, such as a different
# reference temperature, standard state, or an uncertain phase assignment.
# Each entry names the exact record, property, and source, plus the reason.

[[exclusions]]
record_id = "gfe-eu-euf3-q+0-solid-crystalline-trifluoride"
property = "enthalpy_of_formation"
source_id = "EuF3_R05_USBM1984_hf"
reason = "1 atm standard state of the 1984 evaluation; held until reconciled with the 1 bar record"

[[exclusions]]
