name: Release

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.search(r'^__version__ = "([^"]+)"$', Path('src/pourbase/__init__.py').read_text(), re.MULTILINE).group(1)
          tag = os.environ['RELEASE_TAG']
          if tag not in (version, f'v{version}'):
              raise SystemExit(f'Release tag {tag!r} does not match package version {version!r}')
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
